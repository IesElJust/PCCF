[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pccf-tools"
version = "0.1.0"
description = "Eines centralitzades per generar PDFs dels PCCF i programacions MkDocs."
requires-python = ">=3.10"
dependencies = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "lxml",
    "odfpy",
    "PyYAML",
    "Markdown",
    "WeasyPrint",
    "zensical>=0.0.51",
]

[project.scripts]
pccf-genera-pdf = "pccf_pdf.cli:main"
pccf-zensical-build = "pccf_pdf.zensical_cli:main"
pccf-zensical-config = "pccf_pdf.zensical_config_cli:main"
pccf-zensical-serve = "pccf_pdf.zensical_serve_cli:main"
pccf-zensical-full-build = "pccf_pdf.zensical_full_cli:main"

[project.entry-points."mkdocs.plugins"]
add_tables = "pccf_pdf.plugin:AddTablesPlugin"

[tool.setuptools]
packages = ["pccf_pdf"]
include-package-data = true

[tool.setuptools.package-data]
pccf_pdf = [
    "resources/ods2html.xslt",
    "resources/templates/default.html",
    "resources/templates/style-portrait.css",
    "resources/templates/zensical-index.html",
    "resources/templates/zensical-index.css",
    "resources/templates/fonts/*",
    "resources/templates/img/*",
]
