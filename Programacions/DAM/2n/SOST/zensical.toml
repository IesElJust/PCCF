# Generat amb pccf-zensical-config a partir de mkdocs.yml.
[project]
site_name = "Programació Didàctica. Mòdul Sostenibilitat aplicada al sector productiu."
site_dir = "site-zensical"
extra_css = ["styles/taules.css"]
nav = [{ "1. Dades identificatives i contextualització" = "1.Identificacio.md" }, { "2. Relació entre les unitats de competència i mòduls del cicle formatiu" = "2.relacio_uc.md" }, { "3. Contribució dels RA a les competències professionals" = "3.contribucio_ra.md" }, { "4. Resultats d'Aprenentatge, Criteris d'Avaluació i Continguts" = "4.RAs_CAs_Continguts.md" }, { "5. Esquema general i seqüenciació de les UP" = "5.esquema_general_up.md" }, { "6. Metodologia" = "6.Metodologia.md" }, { "7. Recursos" = "7.Recursos.md" }, { "8. Planificació de l'ús d'espais i equipaments" = "8.Espais_equipament.md" }, { "9. Mesures d'atenció a la diversitat i inclusió" = "9.Mesures_Atencio_Diversitat.md" }, { "10. Avaluació de l'aprenentatge" = "10.Avaluacio.md" }, { "11. Activitats complementàries i extraescolars" = "11.Activitats_Complementaries.md" }, { "12. Procediments per a l'avaluació de la programació i la pràctica docent" = "12.Procediments_Avaluacio_PD.md" }]

[project.theme]
variant = "classic"
language = "ca"
logo = "img/logocap.png"
features = ["navigation.top", "toc.follow"]

[[project.theme.palette]]
scheme = "default"
primary = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Canvia al mode fosc"

[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Canvia al mode clar"

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[pccf.tables]
ods_path = "SASP_DAM.ods"
xslt_path = "ods2html.xslt"
